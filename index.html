<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MP4 → MP3 (PWA)</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <style>
    body { font-family: system-ui, Arial; padding: 1rem; max-width: 720px; margin: auto; }
    .hidden { display:none; }
    button { padding: .6rem 1rem; font-size: 1rem; }
    #log { white-space:pre-wrap; font-family: monospace; background:#f7f7f7; padding: .5rem; margin-top: .5rem; max-height: 200px; overflow:auto;}
  </style>
</head>
<body>
  <h1>MP4 → MP3</h1>
  <p>Share an MP4 from Files by Google to this app, or choose a file directly.</p>

  <input id="fileInput" type="file" accept="video/*" />
  <div style="margin-top:.5rem;">
    <button id="convertBtn" disabled>Convert to MP3</button>
    <a id="downloadLink" class="hidden">Download MP3</a>
  </div>

  <div id="status" style="margin-top:.75rem;"></div>
  <div id="log"></div>

  <script src="idb.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
